AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  3S Admin - centralized content platform for the 3S Group websites.
  Cognito (MFA) + Aurora DSQL + Lambda + HTTP API + S3/CloudFront media,
  with the admin app and its API served from one CloudFront domain.

Parameters:
  AlarmEmail:
    Type: String
    Default: ''
    Description: Optional - email that gets an alert when the admin API errors. Leave empty for no alarm.
  LocalDevOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Origin of the local admin dev server, allowed to upload to the media bucket.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Resources:
  # ---------------------------------------------------------------------------
  # Identity - invite-only, authenticator-app MFA on every sign-in
  # ---------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: 3s-admin-users
      UserPoolTier: ESSENTIALS
      DeletionProtection: ACTIVE
      UsernameAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: [email]
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      MfaConfiguration: 'ON'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: Your 3S Admin account
          EmailMessage: >-
            You have been invited to 3S Admin, the content platform for the 3S Group websites.<br><br>
            Email: {username}<br>Temporary password: {####}<br><br>
            Sign in within 7 days. You will choose your own password and set up an authenticator app.
      UserPoolTags:
        Project: 3s-admin

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: 3s-admin-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AuthSessionValidity: 10
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ReadAttributes: [email, email_verified, name]
      WriteAttributes: [name]

  PlatformAdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: platform-admins
      Description: Can edit every website on the platform.
      Precedence: 0

  # ---------------------------------------------------------------------------
  # Content database
  # ---------------------------------------------------------------------------
  Database:
    Type: AWS::DSQL::Cluster
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DeletionProtectionEnabled: true
      Tags:
        - Key: Project
          Value: 3s-admin
        - Key: Name
          Value: 3s-admin-db

  # ---------------------------------------------------------------------------
  # Media - private bucket, served through CloudFront
  # ---------------------------------------------------------------------------
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 3s-admin-media-${AWS::AccountId}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: tidy
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST]
            AllowedOrigins:
              - !Sub https://${AdminDistribution.DomainName}
              - !Ref LocalDevOrigin
            AllowedHeaders: ['*']
            MaxAge: 3000
      Tags:
        - Key: Project
          Value: 3s-admin

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${MediaBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${MediaDistribution}
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt MediaBucket.Arn, !Sub '${MediaBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: 3s-admin-s3
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  MediaDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: 3S Admin - uploaded media for all sites
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        # 200 includes edge locations in India, where most visitors are.
        PriceClass: PriceClass_200
        Origins:
          - Id: media
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: media
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
      Tags:
        - Key: Project
          Value: 3s-admin

  # ---------------------------------------------------------------------------
  # Admin app + API on one domain: /api/* -> HTTP API, everything else -> app
  # ---------------------------------------------------------------------------
  AdminSiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 3s-admin-web-${AWS::AccountId}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: 3s-admin

  AdminSiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminSiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${AdminSiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${AdminDistribution}
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt AdminSiteBucket.Arn, !Sub '${AdminSiteBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: 3s-admin-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Serves index.html for app routes (paths without a file extension)
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var last = request.uri.split('/').pop();
          if (last.indexOf('.') === -1) request.uri = '/index.html';
          return request;
        }

  AdminHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: 3s-admin-security-headers
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'self';
              script-src 'self';
              style-src 'self' 'unsafe-inline';
              img-src 'self' data: blob: https:;
              connect-src 'self' https://cognito-idp.${AWS::Region}.amazonaws.com https://3s-admin-media-${AWS::AccountId}.s3.${AWS::Region}.amazonaws.com;
              frame-ancestors 'none';
              base-uri 'self';
              form-action 'self';
              object-src 'none'
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: false
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
        CustomHeadersConfig:
          Items:
            - Header: X-Robots-Tag
              Value: noindex, nofollow
              Override: true
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=(), payment=()
              Override: true

  AdminDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: 3S Admin - admin app and API
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Origins:
          - Id: app
            DomainName: !GetAtt AdminSiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: app
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref AdminHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref AdminHeadersPolicy
      Tags:
        - Key: Project
          Value: 3s-admin

  # ---------------------------------------------------------------------------
  # API
  # ---------------------------------------------------------------------------
  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: 3s-admin-api-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${ApiFunctionLogGroup.Arn}:*
              - Sid: DatabaseAsAppRole
                Effect: Allow
                Action: dsql:DbConnect
                Resource: !GetAtt Database.ResourceArn
              - Sid: MediaUploadGrants
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${MediaBucket.Arn}/*
              - Sid: PublishWebhooks
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/3s-admin/sites/*
      Tags:
        - Key: Project
          Value: 3s-admin

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/3s-admin-api
      RetentionInDays: 30

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: 3s-admin-api
      Description: 3S Admin content API (code deployed by scripts/deploy-api.mjs)
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 512
      Timeout: 15
      Role: !GetAtt ApiFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref ApiFunctionLogGroup
      Environment:
        Variables:
          DSQL_ENDPOINT: !Sub ${Database.Identifier}.dsql.${AWS::Region}.on.aws
          MEDIA_BUCKET: !Ref MediaBucket
          MEDIA_BASE_URL: !Sub https://${MediaDistribution.DomainName}
          NODE_OPTIONS: --enable-source-maps
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 503, body: '{"error":"The admin API is not deployed yet."}' });
      Tags:
        - Key: Project
          Value: 3s-admin

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: 3s-admin-api
      ProtocolType: HTTP
      Description: 3S Admin API (served to browsers through the admin CloudFront domain under /api)
      Tags:
        Project: 3s-admin

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito-id-token
      AuthorizerType: JWT
      IdentitySource: [$request.header.Authorization]
      JwtConfiguration:
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
        Audience: [!Ref UserPoolClient]

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 15000

  AuthenticatedRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /api/{proxy+}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${ApiIntegration}

  DeliveryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/delivery/{site}
      AuthorizationType: NONE
      Target: !Sub integrations/${ApiIntegration}

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/apigateway/3s-admin-api
      RetentionInDays: 30

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","time":"$context.requestTime","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latency":"$context.responseLatency","user":"$context.authorizer.claims.email","error":"$context.error.message","authError":"$context.authorizer.error"}'

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  # ---------------------------------------------------------------------------
  # Optional alerting
  # ---------------------------------------------------------------------------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      TopicName: 3s-admin-alarms
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmName: 3s-admin-api-errors
      AlarmDescription: The 3S Admin API is failing requests.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  AdminUrl:
    Value: !Sub https://${AdminDistribution.DomainName}
  DeliveryUrlPattern:
    Description: What a site's build pulls (replace <site>)
    Value: !Sub https://${AdminDistribution.DomainName}/api/delivery/<site>
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  DatabaseIdentifier:
    Value: !GetAtt Database.Identifier
  DatabaseEndpoint:
    Value: !Sub ${Database.Identifier}.dsql.${AWS::Region}.on.aws
  ApiFunctionName:
    Value: !Ref ApiFunction
  ApiFunctionRoleArn:
    Value: !GetAtt ApiFunctionRole.Arn
  MediaBucket:
    Value: !Ref MediaBucket
  MediaBaseUrl:
    Value: !Sub https://${MediaDistribution.DomainName}
  AdminSiteBucket:
    Value: !Ref AdminSiteBucket
  AdminDistributionId:
    Value: !Ref AdminDistribution
